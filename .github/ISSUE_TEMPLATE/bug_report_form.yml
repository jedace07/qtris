name: Bug Report
description: File a bug report
labels: ["needs triage"]
body:
  - type: markdown
    id: importantnotice
    attributes:
      value: |
        ### Important notice
        **This repository is not a place for requesting support with a game, runner or an installer.**
        *DO NOT REPORT BUGS FOR OLD QTRIS VERSIONS. MAKE SURE YOU UP TO DATE AND ARE USING THE LATEST VERSION AVAILABLE.
        *BUGS REPORTS SUBMITTED ON OLD VERSIONS WILL BE CLOSED WITHOUT FURTHER CONSIDERATION.
        *If you have issues installing a game or launching it*, make sure your graphics drivers, including their 32-bit Vulkan libraries, are installed and up to date.
        *If a game fails in a Flathub app or in Proton*, check that it works there outside of Qtris before reporting it here.
        *If you think Qtris is missing an important feature*, try opening a *Feature Request* instead.
  - type: textarea
    id: description
    attributes:
      label: "Bug description"
      description: "A clear and detailed description of what the bug is."
      placeholder: "Tell us about your problem with Qtris in a clear and  detailed way"
    validations:
      required: true
  - type: textarea
    id: howtoreproduce
    attributes:
      label: How to Reproduce
      description: "Steps to reproduce the behavior and what should be observed in the end."
      placeholder: "Tell us step by step how we can replicate your problem and what we should see in the end"
      value: |
          Steps to reproduce the behavior:
          1. Go to '....'
          2. Click on '....'
          3. Do '....'
          4. See '....'
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"
      description: "A clear and detailed description of what you think should happen."
      placeholder: "Tell us what you expected Qtris to do"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: "Close Qtris, launch it in the terminal using the command `qtris -d`, reproduce your issue, then paste all of the output from the terminal here. Do not shortnen/prune the output."
      placeholder: "Full output from the `qtris -d` command after reproducing the issue"
      render: shell
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: "System Information"
      description: "An auto-generated summary about system configuration from the Qtris settings."
      placeholder: "Paste it in this text form"
      render: shell
    validations:
      required: true
  - type: markdown
    id: systemsummarygif
    attributes:
      value: |
        ***You can obtain a quick system summary from within Qtris like this:***

        ![Peek 2021-11-12 05-09-2](https://user-images.githubusercontent.com/10602045/142093883-fb1169f2-28ab-4382-8e54-d7de9c96243e.gif)
  - type: textarea
    id: media
    attributes:
      label: Media (optional)
      description: "Screenshots or a Peek recorded GIF that showcases the problem."
      placeholder: If applicable, click on this form to activate it, then attach a GIF or a screenshot of the issue here by selecting or drag-and-dropping it
  - type: markdown
    id: peekinfo
    attributes:
      value: |
        ***Learn more about Peek and how it can record a GIF of your desktop here: https://github.com/phw/peek***
