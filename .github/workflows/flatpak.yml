name: Flatpak

# Builds the Flatpak from packaging/flatpak and uploads the single-file bundle
# as a workflow artifact. The Build Draft Release workflow calls this one and
# attaches the bundle to a draft release
on:
  workflow_call:
    outputs:
      app_version:
        description: Qtris version from pyproject.toml
        value: ${{ jobs.prepare.outputs.app_version }}
      artifact_version:
        description: Version label of the bundle's filename
        value: ${{ jobs.prepare.outputs.artifact_version }}
      is_prerelease:
        description: Whether the version is a prerelease
        value: ${{ jobs.prepare.outputs.is_prerelease }}
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Resolve build versions
        id: version
        run: |
          app_version="$(uv version --short)"
          artifact_version="$(uv run --no-project --with packaging python qtris/version.py --artifact-version "$app_version")"
          if [ "$app_version" = "$artifact_version" ]; then
            is_prerelease=false
          else
            is_prerelease=true
          fi
          {
            echo "app_version=$app_version"
            echo "artifact_version=$artifact_version"
            echo "is_prerelease=$is_prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    # Flatpak's official builder action, in the Flathub CI image for the
    # manifest's runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
      volumes:
        # A named volume, which Docker fills from the image: flatpak can't update the
        # runtimes the image ships inside its overlay ("Invalid cross-device link"),
        # but can once they sit on the runner's own disk
        - flatpak:/var/lib/flatpak
        # Runner directories to delete, to make room for the build
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    env:
      BUNDLE: Qtris-v${{ needs.prepare.outputs.artifact_version }}-x86_64.flatpak
    steps:
      - name: Free disk space
        # Leave room for the SDK, multilib builds and the export repo
        run: |
          rm -rf /host/dotnet/* /host/android/* /host/ghc/* /__t/CodeQL
          df -h /var/lib/flatpak "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Restore the flatpak-builder cache
        # Cached here rather than by the action, which saves only after a successful
        # build: the first one can run out of time, and the next run should
        # resume from the modules that did build
        uses: actions/cache/restore@v6
        with:
          path: build-flatpak/state
          # The prefix names the build setup, so caches from another one (whose git
          # mirrors this flatpak-builder may not be able to use) never match
          key: flatpak-builder-action-${{ hashFiles('packaging/flatpak/**') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-action-${{ hashFiles('packaging/flatpak/**') }}-
            flatpak-builder-action-
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/io.github.jedace07.Qtris.yml
          bundle: ${{ env.BUNDLE }}
          build-dir: build-flatpak/build
          repo-dir: build-flatpak/repo
          state-dir: build-flatpak/state
          restore-cache: false
          save-cache: false
          # Uploaded below instead, unzipped, as the draft release expects
          upload-artifact: false
      - name: Save the flatpak-builder cache
        # Also after a failure or timeout
        if: always()
        uses: actions/cache/save@v6
        with:
          path: build-flatpak/state
          key: flatpak-builder-action-${{ hashFiles('packaging/flatpak/**') }}-${{ github.sha }}
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}
          archive: false
          if-no-files-found: error
